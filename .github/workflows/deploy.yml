name: Deploy to AWS EC2

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push back-ventas
        run: |
          docker build -f Dockerfile.backend \
            -t $ECR_REGISTRY/citt-back-ventas:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/citt-back-ventas:latest

      - name: Build y push back-despachos
        run: |
          docker build -f Dockerfile.backend \
            -t $ECR_REGISTRY/citt-back-despachos:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/citt-back-despachos:latest

      - name: Build y push frontend
        run: |
          docker build -f Dockerfile.frontend \
            -t $ECR_REGISTRY/citt-front:latest \
            ./front_despacho
          docker push $ECR_REGISTRY/citt-front:latest

      - name: Deploy en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            cd ~/proyecto
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -f