services:

  mysql:
    image: mysql:8.0
    container_name: citt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: citt_db
      MYSQL_USER: citt_user
      MYSQL_PASSWORD: citt_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: ../../Dockerfile.backend
    container_name: citt-back-ventas
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: citt_db
      DB_USERNAME: citt_user
      DB_PASSWORD: citt_pass
      SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy

  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: ../../Dockerfile.backend
    container_name: citt-back-despachos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: citt_db
      DB_USERNAME: citt_user
      DB_PASSWORD: citt_pass
      SERVER_PORT: 8081
    depends_on:
      mysql:
        condition: service_healthy

  front-despacho:
    build:
      context: ./front_despacho
      dockerfile: ../Dockerfile.frontend
    container_name: citt-front
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - back-ventas
      - back-despachos

volumes:
  mysql_data: